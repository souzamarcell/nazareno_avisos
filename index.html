<script>
/* ============================= AUTENTICAÇÃO ============================= */
const AUTH_KEY = 'inz_session';
const USUARIOS = [
  { usuario:'Admin', senha:'123' },
  { usuario:'Marcell', senha:'123' },
  { usuario:'Felipe', senha:'123' }
];
function getSession(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e){ return null; } }
function doLogin(ev){
  ev.preventDefault();
  const usuario = document.getElementById('loginUsuario').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const found = USUARIOS.find(u => u.usuario.toLowerCase() === usuario.toLowerCase() && u.senha === senha);
  const errEl = document.getElementById('loginError');
  if (!found) {
    errEl.textContent = 'Usuário ou senha inválidos.';
    errEl.classList.remove('hidden');
    return false;
  }
  errEl.classList.add('hidden');
  localStorage.setItem(AUTH_KEY, JSON.stringify({ usuario: found.usuario, entrouEm: new Date().toISOString() }));
  showApp();
  return false;
}
function doLogout(){
  openConfirm('Sair', 'Deseja encerrar a sessão?', 'Sair', () => {
    localStorage.removeItem(AUTH_KEY);
    closeSidebar();
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginForm').reset();
    document.getElementById('loginUsuario').focus();
  });
}
const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%234F938A'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23FBF8F3'/%3E%3Cpath d='M6 37c0-8.5 6.3-14 14-14s14 5.5 14 14' fill='%23FBF8F3'/%3E%3C/svg%3E";
function updateHeaderUser(){
  const session = getSession();
  const photo = document.getElementById('headerUserPhoto');
  const nameEl = document.getElementById('headerUserName');
  if (!session || !photo || !nameEl) return;
  nameEl.textContent = session.usuario;
  photo.alt = session.usuario;
  photo.onerror = function(){ this.onerror = null; this.src = DEFAULT_AVATAR; };
  photo.src = `imagem/${session.usuario.toLowerCase()}.jpg`;
}
function showApp(){
  const session = getSession();
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  const el = document.getElementById('sidebarUsuario');
  if (el && session) el.textContent = session.usuario;
  updateHeaderUser();
  seedIfEmpty();
  render();
}
function checkAuth(){
  if (getSession()) { showApp(); } else { document.getElementById('loginUsuario').focus(); }
}

/* ============================= DATABASE LAYER ============================= */
const DB_KEYS = { PESSOAS:'inz_pessoas', CRIANCAS:'inz_criancas', VEICULOS:'inz_veiculos', MENSAGENS:'inz_mensagens', CONFIG:'inz_config' };

const DB = {
  getAll(key){ try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : (v && typeof v==='object' ? v : []); } catch(e){ return []; } },
  setAll(key, arr){ localStorage.setItem(key, JSON.stringify(arr)); },
  getById(key, id){ return DB.getAll(key).find(r => r.id === id) || null; },
  add(key, obj){
    const now = new Date().toISOString();
    const rec = Object.assign({ id: uid() }, obj, { criadoEm: now, atualizadoEm: now });
    const arr = DB.getAll(key); arr.push(rec); DB.setAll(key, arr); return rec;
  },
  update(key, id, patch){
    const arr = DB.getAll(key);
    const idx = arr.findIndex(r => r.id === id);
    if (idx === -1) return null;
    arr[idx] = Object.assign({}, arr[idx], patch, { atualizadoEm: new Date().toISOString() });
    DB.setAll(key, arr); return arr[idx];
  },
  remove(key, id){ const arr = DB.getAll(key).filter(r => r.id !== id); DB.setAll(key, arr); },
  getConfig(){
    const c = JSON.parse(localStorage.getItem(DB_KEYS.CONFIG) || 'null');
    return c || { nomeIgreja: 'Igreja do Nazareno', ddi: '55' };
  },
  setConfig(cfg){ localStorage.setItem(DB_KEYS.CONFIG, JSON.stringify(cfg)); }
};

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTime(iso){ if(!iso) return '—'; try { return new Date(iso).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' }); } catch(e){ return '—'; } }
function calcIdade(dataNascISO){
  if (!dataNascISO) return null;
  const nasc = new Date(dataNascISO + 'T00:00:00');
  if (isNaN(nasc.getTime())) return null;
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAniversario = (hoje.getMonth() < nasc.getMonth()) || (hoje.getMonth() === nasc.getMonth() && hoje.getDate() < nasc.getDate());
  if (aindaNaoFezAniversario) idade--;
  return idade >= 0 ? idade : null;
}
function fmtIdade(dataNascISO){
  const idade = calcIdade(dataNascISO);
  if (idade === null) return '';
  return idade === 1 ? '1 ano' : `${idade} anos`;
}
function onlyDigits(s){ return (s || '').replace(/\D/g, ''); }
function formatPhoneDisplay(digits){
  const d = onlyDigits(digits);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  if (d.length === 0) return '—';
  return d;
}

/* Seed default messages on first run */
function seedIfEmpty(){
  if (DB.getAll(DB_KEYS.MENSAGENS).length === 0) {
    const defaults = [
      { titulo:'Solicitar contato', categoria:'geral', texto:'Olá, {NOME}! Precisamos falar com você. Poderia entrar em contato conosco?' },
      { titulo:'Contato sobre a criança', categoria:'crianca', texto:'Olá, {NOME}! Estamos entrando em contato sobre {CRIANCA}, que está no berçário.' },
      { titulo:'Solicitar presença do responsável', categoria:'crianca', texto:'Olá, {NOME}! Poderia comparecer ao berçário para falar sobre {CRIANCA}, quando possível?' },
      { titulo:'Avisar sobre a criança', categoria:'crianca', texto:'Olá, {NOME}! Um breve aviso sobre {CRIANCA}. Poderia nos retornar assim que possível?' },
      { titulo:'Avisar sobre veículo', categoria:'veiculo', texto:'Olá, {NOME}! Precisamos falar sobre o veículo de placa {PLACA}.' },
      { titulo:'Solicitar retirada do veículo', categoria:'veiculo', texto:'Olá, {NOME}! Poderia retirar o veículo de placa {PLACA}? Ele está bloqueando a saída.' },
      { titulo:'Veículo sendo procurado', categoria:'veiculo', texto:'Olá, {NOME}! O veículo de placa {PLACA} está sendo procurado. Poderia comparecer ao local?' },
      { titulo:'Mensagem geral', categoria:'geral', texto:'Olá, {NOME}! Tudo bem? Gostaríamos de falar rapidamente com você.' }
    ];
    defaults.forEach(m => DB.add(DB_KEYS.MENSAGENS, m));
  }
}

/* ============================= UI: TOASTS ============================= */
function toast(msg, type){
  type = type || 'success';
  const colors = { success:'bg-brand-500', error:'bg-rose-600', info:'bg-slate-700' };
  const el = document.createElement('div');
  el.className = `toast-enter ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg text-sm max-w-xs sm:max-w-sm flex items-center gap-2`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'⚠️':'ℹ️'}</span><span>${esc(msg)}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 300); }, 2800);
}

/* ============================= UI: CONFIRM DIALOG ============================= */
function openConfirm(title, message, confirmLabel, onYes){
  const root = document.getElementById('confirmRoot');
  root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-[90] flex items-end sm:items-center justify-center p-3" onclick="if(event.target===this) closeConfirmDialog()">
      <div class="modal-pop bg-white rounded-2xl shadow-2xl w-full sm:max-w-sm p-5">
        <h3 class="font-display font-semibold text-lg text-slate-800 mb-1">${esc(title)}</h3>
        <p class="text-slate-600 text-sm mb-5">${esc(message)}</p>
        <div class="flex gap-2 justify-end">
          <button onclick="closeConfirmDialog()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 font-medium hover:bg-slate-50">Cancelar</button>
          <button id="confirmYesBtn" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-medium hover:bg-rose-700">${esc(confirmLabel || 'Confirmar')}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmYesBtn').onclick = () => { closeConfirmDialog(); onYes(); };
}
function closeConfirmDialog(){ document.getElementById('confirmRoot').innerHTML = ''; }

/* ============================= UI: MODAL ============================= */
function openModal(html, opts){
  opts = opts || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-[80] flex items-end sm:items-center justify-center" onclick="if(event.target===this) closeModal()">
      <div class="modal-pop bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] overflow-y-auto">
        ${html}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ============================= SIDEBAR ============================= */
const NAV_ITEMS = [
  { id:'dashboard', label:'Início', icon:'🏠' },
  { id:'pessoas', label:'Pessoas', icon:'👥' },
  { id:'criancas', label:'Crianças', icon:'👶' },
  { id:'veiculos', label:'Veículos', icon:'🚗' },
  { id:'placa', label:'Identificar placa', icon:'📷' },
  { id:'mensagens', label:'Mensagens', icon:'💬' },
  { id:'relatorios', label:'Relatórios', icon:'📊' },
  { id:'backup', label:'Backup', icon:'💾' },
  { id:'restaurar', label:'Restaurar', icon:'♻️' },
  { id:'config', label:'Configurações', icon:'⚙️' },
  { id:'sobre', label:'Sobre', icon:'ℹ️' }
];
function renderSidebarNav(){
  const current = currentRoute().page;
  document.getElementById('sidebarNav').innerHTML = NAV_ITEMS.map(it => `
    <button onclick="navigate('${it.id}'); closeSidebar();" class="sidebar-item ${it.id===current?'active':''} w-full flex items-center gap-3 px-5 py-3 text-slate-700 hover:bg-brand-50 transition text-left">
      <span class="text-lg">${it.icon}</span><span class="text-sm">${it.label}</span>
    </button>`).join('');
}
function openSidebar(){ renderSidebarNav(); document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }

/* ============================= ROUTER ============================= */
function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [page, param] = hash.split('/');
  return { page: page || 'dashboard', param };
}
function navigate(page, param){ location.hash = '#/' + page + (param ? '/' + param : ''); }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => { checkAuth(); });

function render(){
  const { page, param } = currentRoute();
  renderSidebarNav();
  const app = document.getElementById('app');
  const pages = {
    dashboard: renderDashboard,
    pessoas: renderPessoasList,
    pessoa: renderPessoaDetail,
    criancas: renderCriancasList,
    veiculos: renderVeiculosList,
    placa: renderPlacaPage,
    mensagens: renderMensagensList,
    relatorios: renderRelatorios,
    backup: renderBackupPage,
    restaurar: renderRestorePage,
    config: renderConfigPage,
    sobre: renderSobrePage
  };
  const fn = pages[page] || renderDashboard;
  app.innerHTML = fn(param);
  window.scrollTo(0,0);
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const pessoas = DB.getAll(DB_KEYS.PESSOAS);
  const criancas = DB.getAll(DB_KEYS.CRIANCAS);
  const veiculos = DB.getAll(DB_KEYS.VEICULOS);
  const mensagens = DB.getAll(DB_KEYS.MENSAGENS);
  return `
    <div class="mb-5">
      <label class="block text-sm font-medium text-slate-600 mb-1.5">Buscar pessoa, criança, telefone ou placa</label>
      <div class="relative">
        <input id="dashSearch" oninput="renderDashSearchResults()" type="text" placeholder="Buscar pessoa, criança, telefone ou placa..."
          class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-11 pr-4 text-sm shadow-sm focus:border-brand-400">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">🔎</span>
      </div>
      <div id="dashSearchResults"></div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
      ${statCard('👤', pessoas.length, 'Pessoas', 'brand')}
      ${statCard('👶', criancas.length, 'Crianças', 'plum')}
      ${statCard('🚗', veiculos.length, 'Veículos', 'amber2')}
      ${statCard('💬', mensagens.length, 'Mensagens', 'brand')}
    </div>

    <div class="mb-2 text-sm font-semibold text-slate-500 uppercase tracking-wide">Atalhos rápidos</div>

      ${['todas','com_criancas','com_veiculos','sem_criancas','sem_veiculos'].map(f => `
        <button onclick="pessoasFilter='${f}'; renderPessoasTable();" id="filter-${f}" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border ${pessoasFilter===f?'bg-brand-500 text-white border-brand-500':'bg-white text-slate-600 border-slate-300'}">

        </button>`).join('')}

    <div id="pessoasTable">${pessoasTableHtml(pessoas, criancas, veiculos)}</div>
  `;
}
function pessoasTableHtml(pessoas, criancas, veiculos){
  const q = (document.getElementById('pessoasSearch')?.value || '').trim().toLowerCase();
  const qd = onlyDigits(q);
  let list = pessoas.filter(p => !q || p.nome.toLowerCase().includes(q) || (qd && onlyDigits(p.whatsapp).includes(qd)));
  list = list.filter(p => {
    const nc = criancas.filter(c => c.pessoaId === p.id).length;
    const nv = veiculos.filter(v => v.pessoaId === p.id).length;
    if (pessoasFilter==='com_criancas') return nc>0;
    if (pessoasFilter==='com_veiculos') return nv>0;
    if (pessoasFilter==='sem_criancas') return nc===0;
    if (pessoasFilter==='sem_veiculos') return nv===0;
    return true;
  }).sort((a,b) => a.nome.localeCompare(b.nome));
  if (list.length===0) return emptyState('👥','Nenhuma pessoa encontrada','Ajuste os filtros ou cadastre uma nova pessoa.');
  return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-100">
    ${list.map(p => {
      const nc = criancas.filter(c => c.pessoaId===p.id).length;
      const nv = veiculos.filter(v => v.pessoaId===p.id).length;
      return `<div class="p-4 flex items-center gap-3">
        <div class="flex-1 min-w-0 cursor-pointer" onclick="navigate('pessoa','${p.id}')">
          <p class="font-medium text-slate-800 truncate">${esc(p.nome)}</p>
          <p class="text-xs text-slate-400">${formatPhoneDisplay(p.whatsapp)} · 👶 ${nc} · 🚗 ${nv}</p>
        </div>
        <button onclick="openWhatsapp('${p.id}')" title="WhatsApp" class="p-2 rounded-lg bg-brand-50 hover:bg-brand-100 text-brand-600 shrink-0">💬</button>
        <button onclick="navigate('pessoa','${p.id}')" title="Detalhes" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 shrink-0 hidden sm:inline-flex">👁️</button>
        <button onclick="openPessoaForm('${p.id}')" title="Editar" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 shrink-0">✏️</button>
      </div>`;
    }).join('')}
  </div>`;
}
function renderPessoasTable(){
  document.getElementById('pessoasTable').innerHTML = pessoasTableHtml(DB.getAll(DB_KEYS.PESSOAS), DB.getAll(DB_KEYS.CRIANCAS), DB.getAll(DB_KEYS.VEICULOS));
  NAV_ITEMS.forEach(it => {}); // no-op keep filter chip active classes fresh
  ['todas','com_criancas','com_veiculos','sem_criancas','sem_veiculos'].forEach(f=>{
    const el = document.getElementById('filter-'+f);
    if(!el) return;

    else { el.classList.remove('bg-brand-500','text-white','border-brand-500'); el.classList.add('bg-white','text-slate-600','border-slate-300'); }
  });
}

function savePessoa(ev, id){
  ev.preventDefault();
  const f = ev.target;
  const data = { nome: f.nome.value.trim(), whatsapp: onlyDigits(f.whatsapp.value), telAlt: onlyDigits(f.telAlt.value), obs: f.obs.value.trim() };
  if (!data.nome || !data.whatsapp) { toast('Preencha nome e WhatsApp.', 'error'); return false; }
  if (id) DB.update(DB_KEYS.PESSOAS, id, data); else DB.add(DB_KEYS.PESSOAS, data);
  closeModal(); toast(id?'Pessoa atualizada!':'Pessoa cadastrada!'); render();
  return false;
}
function deletePessoa(id){
  const p = DB.getById(DB_KEYS.PESSOAS, id); if(!p) return;
  openConfirm('Excluir pessoa', `Tem certeza que deseja excluir ${p.nome}? Crianças e veículos vinculados perderão o vínculo.`, 'Excluir', () => {
    DB.getAll(DB_KEYS.CRIANCAS).filter(c=>c.pessoaId===id).forEach(c => DB.update(DB_KEYS.CRIANCAS, c.id, { pessoaId: null }));
    DB.getAll(DB_KEYS.VEICULOS).filter(v=>v.pessoaId===id).forEach(v => DB.update(DB_KEYS.VEICULOS, v.id, { pessoaId: null }));
    DB.remove(DB_KEYS.PESSOAS, id);
    toast('Pessoa excluída.'); navigate('pessoas');
  });
}
function openWhatsapp(pessoaId, presetText){
  const p = DB.getById(DB_KEYS.PESSOAS, pessoaId);
  if (!p || !p.whatsapp) { toast('WhatsApp não cadastrado.', 'error'); return; }
  const cfg = DB.getConfig();
  let num = onlyDigits(p.whatsapp);
  if (!num.startsWith(cfg.ddi)) num = cfg.ddi + num;
  const url = `https://wa.me/${num}` + (presetText ? `?text=${encodeURIComponent(presetText)}` : '');
  window.open(url, '_blank');
}

let cameraStream = null;
function renderPlacaPage(){
  return `
    ${pageHeader('📷 Identificar Placa', null)}
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-5">

      <div id="cameraArea" class="rounded-xl overflow-hidden bg-slate-900 aspect-video flex items-center justify-center text-slate-400 text-sm mb-3">
        Câmera desligada
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="startCamera()" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium">🎥 Ativar câmera</button>
        <button onclick="captureAndReadPlate()" class="px-4 py-2 rounded-xl bg-amber2-400 hover:bg-amber2-500 text-brand-700 text-sm font-medium">📸 Capturar e ler placa</button>
        <button onclick="stopCamera()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-sm font-medium">Desligar câmera</button>
      </div>
      <p id="ocrStatus" class="text-xs text-slate-400 mt-2"></p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <h3 class="font-semibold text-slate-700 mb-3">🔎 Buscar placa manualmente</h3>
      <div class="flex gap-2">
        <input id="placaBuscaInput" maxlength="8" placeholder="ABC1D23" oninput="this.value=this.value.toUpperCase()" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono uppercase tracking-widest">
        <button onclick="buscarPlacaManual()" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium">Buscar</button>
      </div>
      <div id="placaBuscaResult" class="mt-3"></div>
    </div>
  `;
}
async function startCamera(){
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const area = document.getElementById('cameraArea');
    area.innerHTML = `<video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>`;
    document.getElementById('cameraVideo').srcObject = cameraStream;
    document.getElementById('ocrStatus').textContent = '📷 Câmera ativa — a câmera está sendo usada apenas para ler a placa.';
  } catch(e){
    toast('Não foi possível acessar a câmera. Verifique as permissões.', 'error');
  }
}
function stopCamera(){
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  const area = document.getElementById('cameraArea');
  if (area) area.innerHTML = 'Câmera desligada';
  const status = document.getElementById('ocrStatus'); if (status) status.textContent = '';
}
async function captureAndReadPlate(){
  const video = document.getElementById('cameraVideo');
  if (!video) { toast('Ative a câmera primeiro.', 'error'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const status = document.getElementById('ocrStatus');
  status.textContent = '🔍 Lendo placa, aguarde...';
  try {
    const { data } = await Tesseract.recognize(canvas, 'eng');
    let raw = (data.text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    raw = raw.slice(0, 7);
    status.textContent = raw ? `Placa identificada: ${raw}` : 'Não foi possível identificar a placa. Tente novamente ou digite manualmente.';
    openPlacaConfirmModal(raw);
  } catch(e){
    status.textContent = 'Erro ao processar a imagem.';
    toast('Erro na leitura da placa.', 'error');
  }
}
function openPlacaConfirmModal(placaLida){
  openModal(`
    <div class="p-5">
      <h3 class="font-display text-lg font-semibold mb-1">Confirmar placa</h3>
      <p class="text-sm text-slate-500 mb-3">Confira e corrija os caracteres, se necessário.</p>
      <input id="placaConfirmInput" value="${esc(placaLida)}" maxlength="8" oninput="this.value=this.value.toUpperCase()" class="w-full rounded-lg border border-slate-300 px-3 py-3 text-lg font-mono uppercase tracking-widest text-center mb-4">

  `);
}
function confirmPlacaLida(){

  closeModal();

  if (existente) { navigate('pessoa', existente.pessoaId || undefined); if(!existente.pessoaId){ toast('Veículo encontrado, mas sem pessoa vinculada.', 'info'); navigate('veiculos'); } }
  else { openVeiculoForm(null, null, placa); toast('Placa não encontrada. Complete o cadastro.', 'info'); }

      <button onclick="openVeiculoForm('${v.id}')" class="px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 text-sm font-medium">✏️ Editar</button>

/* Send message modal (contextual, from person detail) */
function openSendMessageModal(pessoaId){
  const p = DB.getById(DB_KEYS.PESSOAS, pessoaId);
  if (!p) return;
  const criancas = DB.getAll(DB_KEYS.CRIANCAS).filter(c=>c.pessoaId===pessoaId);
  const veiculos = DB.getAll(DB_KEYS.VEICULOS).filter(v=>v.pessoaId===pessoaId);
  const msgs = DB.getAll(DB_KEYS.MENSAGENS);
  openModal(`
    <div class="p-5">
      <h3 class="font-display text-lg font-semibold mb-1">Enviar mensagem</h3>
      <p class="text-sm text-slate-500 mb-3">Para: <strong>${esc(p.nome)}</strong></p>
      <label class="block text-xs font-medium text-slate-600 mb-1">Mensagem</label>
      <select id="sendMsgSelect" onchange="updateSendMessagePreview('${pessoaId}')" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white mb-3">
        <option value="">— Escrever mensagem personalizada —</option>
        ${msgs.map(m=>`<option value="${m.id}">${esc(m.titulo)}</option>`).join('')}
      </select>
      ${criancas.length ? `<label class="block text-xs font-medium text-slate-600 mb-1">Criança (para {CRIANCA})</label>
      <select id="sendMsgCrianca" onchange="updateSendMessagePreview('${pessoaId}')" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white mb-3">
        ${criancas.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}
      </select>` : ''}
      ${veiculos.length ? `<label class="block text-xs font-medium text-slate-600 mb-1">Veículo (para {PLACA})</label>
      <select id="sendMsgVeiculo" onchange="updateSendMessagePreview('${pessoaId}')" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white mb-3">
        ${veiculos.map(v=>`<option value="${v.id}">${esc(v.placa)}</option>`).join('')}
      </select>` : ''}
      <label class="block text-xs font-medium text-slate-600 mb-1">Prévia (editável)</label>
      <textarea id="sendMsgPreview" rows="4" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm mb-4"></textarea>
      <div class="flex gap-2 justify-end">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 font-medium">Cancelar</button>
        <button onclick="sendPreparedMessage('${pessoaId}')" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-medium">💬 Abrir WhatsApp</button>
      </div>
    </div>
  `);
  updateSendMessagePreview(pessoaId);
}
function updateSendMessagePreview(pessoaId){
  const p = DB.getById(DB_KEYS.PESSOAS, pessoaId);
  const msgId = document.getElementById('sendMsgSelect').value;
  const msg = msgId ? DB.getById(DB_KEYS.MENSAGENS, msgId) : null;
  const criancaSel = document.getElementById('sendMsgCrianca');
  const veiculoSel = document.getElementById('sendMsgVeiculo');
  const crianca = criancaSel ? DB.getById(DB_KEYS.CRIANCAS, criancaSel.value) : null;
  const veiculo = veiculoSel ? DB.getById(DB_KEYS.VEICULOS, veiculoSel.value) : null;
  const vars = { NOME: p.nome, CRIANCA: crianca?crianca.nome:'', PLACA: veiculo?veiculo.placa:'' };
  const base = msg ? msg.texto : '';
  document.getElementById('sendMsgPreview').value = fillTemplate(base, vars);
}
function fillTemplate(text, vars){
  return (text||'').replace(/\{NOME\}/g, vars.NOME||'').replace(/\{CRIANCA\}/g, vars.CRIANCA||'').replace(/\{PLACA\}/g, vars.PLACA||'');
}
function sendPreparedMessage(pessoaId){
  const text = document.getElementById('sendMsgPreview').value;
  closeModal();
  openWhatsapp(pessoaId, text);
}

/* ============================= RELATÓRIOS ============================= */
function renderRelatorios(){
  const pessoas = DB.getAll(DB_KEYS.PESSOAS);
  const criancas = DB.getAll(DB_KEYS.CRIANCAS);
  const veiculos = DB.getAll(DB_KEYS.VEICULOS);
  const mensagens = DB.getAll(DB_KEYS.MENSAGENS);
  const recentPessoas = [...pessoas].sort((a,b)=>new Date(b.criadoEm)-new Date(a.criadoEm)).slice(0,8);
  const recentVeiculos = [...veiculos].sort((a,b)=>new Date(b.criadoEm)-new Date(a.criadoEm)).slice(0,8);
  return `
    ${pageHeader('📊 Relatórios', null)}
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      ${statCard('👤', pessoas.length, 'Pessoas', 'brand')}
      ${statCard('👶', criancas.length, 'Crianças', 'plum')}
      ${statCard('🚗', veiculos.length, 'Veículos', 'amber2')}
      ${statCard('💬', mensagens.length, 'Mensagens', 'brand')}
    </div>
    <h3 class="font-semibold text-slate-700 mb-2">Pessoas cadastradas recentemente</h3>
    ${reportTable(recentPessoas, ['Nome','WhatsApp','Cadastrado em'], r => [esc(r.nome), formatPhoneDisplay(r.whatsapp), fmtDateTime(r.criadoEm)])}
    <h3 class="font-semibold text-slate-700 mb-2 mt-6">Veículos cadastrados recentemente</h3>
    ${reportTable(recentVeiculos, ['Placa','Modelo/Cor','Cadastrado em'], r => [esc(r.placa), (esc(r.modelo||'')+' '+esc(r.cor||'')).trim()||'—', fmtDateTime(r.criadoEm)])}
  `;
}
function reportTable(rows, headers, mapper){
  if (rows.length===0) return emptyState('📄','Sem dados ainda','Os registros aparecerão aqui.');
  return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-400 text-xs uppercase">${headers.map(h=>`<th class="px-4 py-2.5 font-medium">${h}</th>`).join('')}</tr></thead>
      <tbody class="divide-y divide-slate-100">
        ${rows.map(r => `<tr>${mapper(r).map(c=>`<td class="px-4 py-2.5 whitespace-nowrap">${c}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ============================= BACKUP ============================= */
function renderBackupPage(){
  return `
    ${pageHeader('💾 Backup', null)}
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <p class="text-sm text-slate-500 mb-4">Gere um arquivo com todos os dados cadastrados (pessoas, crianças, veículos, mensagens e configurações) para guardar em outro local.</p>
      <button onclick="doBackup()" class="px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium">⬇️ Baixar backup (.json)</button>
    </div>
  `;
}
function doBackup(){
  const payload = {
    versao: 1,
    exportadoEm: new Date().toISOString(),
    pessoas: DB.getAll(DB_KEYS.PESSOAS),
    criancas: DB.getAll(DB_KEYS.CRIANCAS),
    veiculos: DB.getAll(DB_KEYS.VEICULOS),
    mensagens: DB.getAll(DB_KEYS.MENSAGENS),
    config: DB.getConfig()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const dateStr = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `igreja-nazareno-backup-${dateStr}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup gerado com sucesso!');
}

/* ============================= RESTORE ============================= */
let pendingRestoreData = null;
function renderRestorePage(){
  return `
    ${pageHeader('♻️ Restaurar Backup', null)}
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <p class="text-sm text-slate-500 mb-4">Selecione um arquivo de backup (.json) gerado anteriormente por este aplicativo.</p>
      <input type="file" id="restoreFile" accept="application/json" onchange="handleRestoreFile(event)" class="block w-full text-sm text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-50 file:text-brand-600 file:font-medium">
      <div id="restorePreview" class="mt-4"></div>
    </div>
  `;
}
function handleRestoreFile(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.pessoas) || !Array.isArray(data.criancas) || !Array.isArray(data.veiculos) || !Array.isArray(data.mensagens)) {
        toast('Arquivo de backup inválido.', 'error'); return;
      }
      pendingRestoreData = data;
      document.getElementById('restorePreview').innerHTML = `
        <div class="bg-slate-50 rounded-xl p-4 text-sm text-slate-600">
          <p class="font-medium text-slate-800 mb-2">Serão restaurados:</p>
          <p>👤 ${data.pessoas.length} pessoas</p>
          <p>👶 ${data.criancas.length} crianças</p>
          <p>🚗 ${data.veiculos.length} veículos</p>
          <p>💬 ${data.mensagens.length} mensagens</p>
          <div class="flex gap-2 mt-4">
            <button onclick="confirmRestore('merge')" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium">Mesclar com dados atuais</button>
            <button onclick="confirmRestore('replace')" class="px-4 py-2 rounded-xl border border-rose-300 text-rose-600 text-sm font-medium">Substituir tudo</button>
          </div>
        </div>`;
    } catch(err){ toast('Não foi possível ler o arquivo.', 'error'); }
  };
  reader.readAsText(file);
}
function confirmRestore(mode){
  if (!pendingRestoreData) return;
  const msg = mode==='replace'
    ? 'Isto irá substituir todos os dados atuais pelos dados do backup. Deseja continuar?'
    : 'Isto irá mesclar os dados do backup com os dados atuais (sem duplicar por ID). Deseja continuar?';
  openConfirm('Restaurar backup', msg, 'Restaurar', () => {
    const d = pendingRestoreData;
    if (mode==='replace') {
      DB.setAll(DB_KEYS.PESSOAS, d.pessoas); DB.setAll(DB_KEYS.CRIANCAS, d.criancas);
      DB.setAll(DB_KEYS.VEICULOS, d.veiculos); DB.setAll(DB_KEYS.MENSAGENS, d.mensagens);
      if (d.config) DB.setConfig(d.config);
    } else {
      mergeByArray(DB_KEYS.PESSOAS, d.pessoas); mergeByArray(DB_KEYS.CRIANCAS, d.criancas);
      mergeByArray(DB_KEYS.VEICULOS, d.veiculos); mergeByArray(DB_KEYS.MENSAGENS, d.mensagens);
    }
    pendingRestoreData = null;
    toast('Backup restaurado com sucesso!'); navigate('dashboard');
  });
}
function mergeByArray(key, incoming){
  const current = DB.getAll(key);
  const byId = new Map(current.map(r => [r.id, r]));
  incoming.forEach(r => byId.set(r.id, Object.assign({}, byId.get(r.id)||{}, r)));
  DB.setAll(key, Array.from(byId.values()));
}

/* ============================= CONFIG / SOBRE ============================= */
function renderConfigPage(){
  const cfg = DB.getConfig();
  return `
    ${pageHeader('⚙️ Configurações', null)}
    <form onsubmit="return saveConfig(event)" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-3">
      <div><label class="block text-xs font-medium text-slate-600 mb-1">Nome exibido no cabeçalho</label>
        <input name="nomeIgreja" value="${esc(cfg.nomeIgreja)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></div>
      <div><label class="block text-xs font-medium text-slate-600 mb-1">Código do país (DDI) para WhatsApp</label>
        <input name="ddi" value="${esc(cfg.ddi)}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="55"></div>
      <button type="submit" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium">Salvar configurações</button>
    </form>
  `;
}
function saveConfig(ev){
  ev.preventDefault();
  const f = ev.target;
  DB.setConfig({ nomeIgreja: f.nomeIgreja.value.trim()||'Igreja do Nazareno', ddi: onlyDigits(f.ddi.value)||'55' });
  toast('Configurações salvas!');
  return false;
}
